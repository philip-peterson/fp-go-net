name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - run: go install gotest.tools/gotestsum@latest
      - name: Run tests
        run: |
          rc=0
          for mod in . fp-go-net-tls examples; do
            (cd "$mod" && gotestsum --junitfile "$GITHUB_WORKSPACE/junit-$(basename $(pwd)).xml" -- -count=1 ./...) || rc=1
          done
          exit $rc
      - uses: philip-peterson/publish-ci-results-action@v1
        if: always()
        with:
          report_paths: "junit-*.xml"
          fail_on_failure: true
          include_passed: true
          detailed_summary: true
          annotate_only: false
